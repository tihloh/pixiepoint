<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>PixiePoint Wi-Fi</title>
  </head>
  <body>
    <main id="pixiepoint-root">
      <strong>PixiePoint Wi-Fi</strong>
      <p id="boot-status">Opening your active session…</p>
    </main>

    <script>
      window.PIXIEPOINT_SESSION = {
        username: '$(username)',
        mac: '$(mac)',
        macEsc: '$(mac-esc)',
        ip: '$(ip)',
        routerIdentity: '$(identity)',
        serverAddress: '$(server-address)',
        interfaceName: '$(interface-name)',
        sessionTimeLeft: '$(session-time-left-secs)',
        bytesIn: '$(bytes-in)',
        bytesOut: '$(bytes-out)',
        remainBytesTotal: '$(remain-bytes-total)',
        refreshUrl: '$(link-status)',
        logoutUrl: '$(link-logout)',
        loginUrl: '$(link-login)',
      };
    </script>
    <script src="https://hs.portalx.win/assets/hotspot-loader.js?v=20260910-1"></script>
  </body>
</html>
