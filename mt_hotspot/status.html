<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>PixiePoint Wi-Fi</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #eef4ff;
      background: #07111f;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    strong {
      display: block;
      margin-bottom: 10px;
      font-size: 22px;
    }

    p {
      margin: 0;
      color: #9fb0c7;
    }
  </style>
</head>
<body>
  <main id="pixiepoint-root">
    <strong>PixiePoint Wi-Fi</strong>
    <p>Opening your active session…</p>
  </main>

  <script src="vendo-config.js"></script>
  <script>
    window.PIXIEPOINT_SESSION = {
      username: "$(username)",
      mac: "$(mac)",
      ip: "$(ip)",
      routerIdentity: "$(identity)",
      interfaceName: "$(interface-name)",
      uptime: "$(uptime-secs)",
      sessionTimeLeft: "$(session-time-left-secs)",
      bytesIn: "$(bytes-in)",
      bytesOut: "$(bytes-out)",
      remainBytesTotal: "$(remain-bytes-total)",
      refreshUrl: "$(link-status)",
      logoutUrl: "$(link-logout)",
      loginUrl: "$(link-login)"
    };

    (function loadHostedPortal() {
      var hostedOrigin = window.PIXIEPOINT_HOSTED_ORIGIN || "https://hs.portalx.win";
      var version = Date.now();

      var stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = hostedOrigin + "/assets/app.css?v=" + version;
      document.head.appendChild(stylesheet);

      var sessionScript = document.createElement("script");
      sessionScript.src = hostedOrigin + "/assets/session-portal.js?v=" + version;
      document.head.appendChild(sessionScript);

      var deviceInfoScript = document.createElement("script");
      deviceInfoScript.src = hostedOrigin + "/assets/device-info.js?v=" + version;
      document.head.appendChild(deviceInfoScript);
    }());
  </script>
</body>
</html>
