<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>PixiePoint Wi-Fi</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;color:#eef4ff;background:#07111f;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}strong{display:block;font-size:22px;margin-bottom:10px}p{margin:0;color:#9fb0c7}.dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#20d6b5;animation:p 1.5s infinite}@keyframes p{50%{opacity:.3}}</style></head><body><main><strong>PixiePoint Wi-Fi</strong><p><span class="dot"></span><span id="bootstrap-status">Opening your active session…</span></p></main><form id="forward" action="https://hs.portalx.win/hotspot/session" method="post" hidden><input name="username" value="$(username)"><input name="mac" value="$(mac)"><input name="ip" value="$(ip)"><input name="router_identity" value="$(identity)"><input name="uptime" value="$(uptime-secs)"><input name="session_time_left" value="$(session-time-left-secs)"><input name="bytes_in" value="$(bytes-in)"><input name="bytes_out" value="$(bytes-out)"><input name="remain_bytes_total" value="$(remain-bytes-total)"><input name="refresh_url" value="$(link-status)"><input name="logout_url" value="$(link-logout)"></form><script src="online-bootstrap.js"></script></body></html>
