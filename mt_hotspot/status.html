<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>PixiePoint Wi-Fi</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #07111f; color: #eef4ff; font: 16px system-ui; text-align: center; }
    p { color: #9fb0c7; }
  </style>
</head>
<body>
  <main id="pixiepoint-root">
    <strong>PixiePoint Wi-Fi</strong>
    <p id="boot-status">Opening your active session…</p>
  </main>

  <script src="vendo-config.js"></script>
  <script>
    window.PIXIEPOINT_SESSION = {
      username: "$(username)",
      mac: "$(mac)",
      ip: "$(ip)",
      routerIdentity: "$(identity)",
      interfaceName: "$(interface-name)",
      sessionTimeLeft: "$(session-time-left-secs)",
      bytesIn: "$(bytes-in)",
      bytesOut: "$(bytes-out)",
      remainBytesTotal: "$(remain-bytes-total)",
      refreshUrl: "$(link-status)",
      logoutUrl: "$(link-logout)",
      loginUrl: "$(link-login)"
    };
  </script>
  <script src="https://hs.portalx.win/assets/hotspot-loader.js"></script>
</body>
</html>
