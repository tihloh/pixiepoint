<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$(identity) - Auto Login</title>
    <link rel="stylesheet" href="emulator.css">
</head>
<body>
<main class="page">
    <section class="card">
        <h1>Automatic login</h1>
        <p class="muted">MikroTik Hotspot Emulator — alogin.html</p>
        <p>Testing automatic authentication for <strong>$(username)</strong>.</p>
        <form action="$(link-login-only)" method="post">
            <input type="hidden" name="username" value="$(username)">
            <input type="hidden" name="dst" value="$(link-orig)">
            <button type="submit">Continue</button>
        </form>
    </section>
</main>
<script src="emulator.js"></script>
</body>
</html>
