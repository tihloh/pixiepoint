<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>PixiePoint Wi-Fi</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{color:#eef4ff;background:#07111f;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}#portal{width:100%;height:100%;border:0;background:#07111f}.state{height:100%;display:grid;place-items:center;padding:22px}.card{width:min(100%,430px);padding:30px;border:1px solid #ffffff18;border-radius:24px;background:#0e1d31;box-shadow:0 24px 70px #0007}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:#07111f;background:#20d6b5;font-weight:900}h1{margin:0 0 8px;font-size:30px}p{margin:0;color:#9fb0c7}.detail{margin-top:18px;padding:12px;border-radius:12px;color:#ffc1ca;background:#ff718719;font-size:13px}.hidden{display:none!important}.dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#ff7187;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}</style></head>
<body>
$(if chap-id)<form id="chap-login" action="$(link-login-only)" method="post" hidden><input type="hidden" name="username"><input type="hidden" name="password"><input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true"></form>$(endif)
<form id="pap-login" action="$(link-login-only)" method="post" hidden><input type="hidden" name="username"><input type="hidden" name="password"><input type="hidden" name="dst" value="$(link-orig)"><input type="hidden" name="popup" value="true"></form>
<section id="loading" class="state"><div class="card"><div class="brand"><div class="mark">P</div><strong>PixiePoint Wi-Fi</strong></div><h1>Opening portal…</h1><p>Checking the hosted service.</p></div></section>
<section id="offline" class="state hidden"><div class="card"><div class="brand"><div class="mark">P</div><strong>PixiePoint Wi-Fi</strong></div><h1>Portal unavailable</h1><p>Customer access cannot start until the hosted interface is reachable.</p><div class="detail"><span class="dot"></span><span id="offline-message">Checking again…</span></div></div></section>
<iframe id="portal" class="hidden" title="PixiePoint portal" allow="local-network-access"></iframe>
<script src="vendo-config.js"></script><script src="md5.js"></script>
<script>window.PIXIEPOINT_CONTEXT={mac:"$(mac)",ip:"$(ip)",username:"$(username)",routerIdentity:"$(identity)",interfaceName:"$(interface-name)",serverAddress:"$(server-address)",error:"$(error)"};window.PIXIEPOINT_CHAP={id:"$(chap-id)",challenge:"$(chap-challenge)"};</script>
<script src="bridge.js"></script></body></html>
