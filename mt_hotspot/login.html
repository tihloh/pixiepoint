<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>PixiePoint Wi-Fi</title>
  </head>
  <body>
    <main id="pixiepoint-root">
      <strong>PixiePoint Wi-Fi</strong>
      <p id="boot-status">Checking the hosted portal…</p>
    </main>

    <script src="md5.js"></script>
    <script>
      window.PIXIEPOINT_CONTEXT = {
        mac: '$(mac)',
        macEsc: '$(mac-esc)',
        ip: '$(ip)',
        username: '$(username)',
        routerIdentity: '$(identity)',
        interfaceName: '$(interface-name)',
        serverAddress: '$(server-address)',
        sessionTimeLeft: '$(session-time-left-secs)',
        loginUrl: '$(link-login-only)',
        originalUrl: '$(link-orig)',
        error: '$(error)',
      };
      window.PIXIEPOINT_CHAP = { id: '$(chap-id)', challenge: '$(chap-challenge)' };
      window.PIXIEPOINT_BOOTSTRAP = true;
    </script>
    <script src="https://hs.portalx.win/assets/hotspot-loader.js?v=20260910-1"></script>
  </body>
</html>
