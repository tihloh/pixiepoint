<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Opening Portal...</title>
</head>
<body>
  <p>Opening portal...</p>
  <script>
    (function () {
      var p = new URLSearchParams();
      p.set('router_identity', '$(identity)');
      p.set('server_address', '$(server-address)');
      p.set('client_ip', '$(ip)');
      p.set('interface', '$(interface-name)');
      p.set('mac', '$(mac)');
      p.set('username', '$(username)');
      p.set('login_url', '$(link-login-only)');
      p.set('original_url', '$(link-orig)');
      p.set('chap_id', '$(chap-id)');
      p.set('chap_challenge', '$(chap-challenge)');
      p.set('error', '$(error)');
      history.replaceState(null, '', location.pathname + '?' + p.toString());
    })();
  </script>
  <script src="https://hs.portalx.win/assets/hotspot-embed.js?v=2"></script>
</body>
</html>
