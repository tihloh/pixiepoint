<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>PixiePoint</title></head>
<body>
<div id="pp-local-fallback">Loading PixiePoint…</div>
<script>
(function(){
  var p=new URLSearchParams();
  p.set('router_identity','$(identity)');p.set('server_address','$(server-address)');p.set('client_ip','$(ip)');p.set('interface','$(interface-name)');p.set('mac','$(mac)');p.set('username','$(username)');p.set('login_url','$(link-login)');p.set('disconnected','1');
  fetch('http://hs.portalx.win/hotspot/logout?'+p.toString(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(html){html=html.replace(/<head([^>]*)>/i,'<head$1><base href="http://hs.portalx.win/">');document.open();document.write(html);document.close();}).catch(function(){document.getElementById('pp-local-fallback').innerHTML='<p>You have been logged out.</p><a href="$(link-login)">Connect again</a>';});
})();
</script>
</body>
</html>
