<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>PixiePoint Wi-Fi</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #eef4ff;
      background: #07111f;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    strong {
      display: block;
      margin-bottom: 10px;
      font-size: 22px;
    }

    p {
      margin: 0;
      color: #9fb0c7;
    }
  </style>
</head>
<body>
  <main id="pixiepoint-root">
    <strong>PixiePoint Wi-Fi</strong>
    <p>Opening paused session…</p>
  </main>

  <script>
    window.PIXIEPOINT_DISCONNECTED = {
      username: "$(username)",
      mac: "$(mac)",
      ip: "$(ip)",
      routerIdentity: "$(identity)",
      uptime: "$(uptime-secs)",
      sessionTimeLeft: "$(session-time-left-secs)",
      bytesIn: "$(bytes-in)",
      bytesOut: "$(bytes-out)",
      loginUrl: "$(link-login)"
    };

    (function loadPausedPortal() {
      var script = document.createElement("script");
      script.src = "https://hs.portalx.win/assets/disconnected-portal.js?v=" + Date.now();
      document.head.appendChild(script);
    }());
  </script>
</body>
</html>
