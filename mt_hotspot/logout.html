<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Opening Portal...</title>
</head>
<body>
  <p>Opening portal...</p>
  <script>
    (function () {
      var p = new URLSearchParams();
      p.set('router_identity', '$(identity)');
      p.set('server_address', '$(server-address)');
      p.set('client_ip', '$(ip)');
      p.set('interface', '$(interface-name)');
      p.set('mac', '$(mac)');
      p.set('username', '$(username)');
      p.set('login_url', '$(link-login)');
      p.set('disconnected', '1');
      location.replace('http://hs.portalx.win/hotspot?' + p.toString());
    })();
  </script>
</body>
</html>
