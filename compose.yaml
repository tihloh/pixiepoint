name: pixiepoint

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: pixiepoint_php
    working_dir: /var/www/pixiepoint

    volumes:
      - ./:/var/www/pixiepoint

    environment:
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SESSION_NAME: ${SESSION_NAME}

      DB_DSN: ${DB_DSN}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      ACCOUNTING_KEY: ${ACCOUNTING_KEY}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - sh
      - -c
      - mkdir -p data/sessions && chown -R www-data:www-data data/sessions && composer install --no-interaction --prefer-dist && php bin/migrate.php --auto && exec php-fpm

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s=@fsockopen('127.0.0.1',9000); exit($$s ? 0 : 1);"
      interval: 3s
      timeout: 2s
      retries: 20

    networks:
      webnet:
        aliases:
          - pixiepoint_php

    restart: unless-stopped

networks:
  webnet:
    external: true
