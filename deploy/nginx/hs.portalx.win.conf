server {
    listen 80;
    listen [::]:80;
    server_name hs.portalx.win;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hs.portalx.win;

    # Adapt these paths to the certificate layout in the shared nginx container.
    ssl_certificate /etc/letsencrypt/live/hs.portalx.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.portalx.win/privkey.pem;

    client_max_body_size 2m;

    location = /hotspot/health {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /hotspot/health;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_pass pixiepoint_php:9000;
        add_header Cache-Control "no-store" always;
    }

    root /var/www/html/public;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass pixiepoint_php:9000;
    }
}
