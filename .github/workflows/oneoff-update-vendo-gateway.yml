name: oneoff-update-vendo-gateway
on:
  push:
    paths:
      - .github/workflows/oneoff-update-vendo-gateway.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer update tihloh/vendo-gateway --with-dependencies --no-interaction
      - run: composer validate --strict
      - name: Commit lock update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Vendo Gateway to 1.2.2"
          git push
