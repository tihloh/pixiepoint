name: review-validate
on:
  push:
    branches: ['review/codex-refactor-20260918']
    paths:
      - .github/workflows/review-validate.yml
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: find app src -name '*.php' -print0 | xargs -0 -n1 php -l
