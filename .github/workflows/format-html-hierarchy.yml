name: Format HTML hierarchy

on:
  push:
    branches:
      - main
    paths:
      - .format-html-hierarchy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Save originals
        run: |
          mkdir -p /tmp/pixiepoint-before
          rsync -a --exclude=.git --exclude=node_modules ./ /tmp/pixiepoint-before/

      - name: Install HTML beautifier
        run: npm install --no-save --no-package-lock js-beautify@1.15.4

      - name: Format PHP view HTML hierarchy
        shell: bash
        run: |
          mapfile -d '' views < <(
            find app -type f -name '*.php' \( -path '*/views/*' -o -path 'app/Views/*' \) -print0
          )
          if [ "${#views[@]}" -gt 0 ]; then
            npx html-beautify               --replace               --indent-size 4               --wrap-line-length 0               --max-preserve-newlines 2               --templating php               "${views[@]}"
          fi

      - name: Format standalone HTML hierarchy
        shell: bash
        run: |
          mapfile -d '' htmls < <(
            find app/Portal/Themes mt_hotspot public -type f -name '*.html' -print0
          )
          if [ "${#htmls[@]}" -gt 0 ]; then
            npx html-beautify               --replace               --indent-size 2               --wrap-line-length 0               --max-preserve-newlines 2               --templating php               "${htmls[@]}"
          fi

      - name: Keep PHP template controls on the opening-tag line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              p for p in Path('app').rglob('*.php')
              if '/views/' in p.as_posix() or p.as_posix().startswith('app/Views/')
          ]

          pattern = re.compile(r'<\?php[ \t]*\r?\n[ \t]*(?=(?:if|elseif|else|foreach|for|while|switch|endif|endforeach|endfor|endwhile|endswitch)\b)')

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = pattern.sub('<?php ', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify only whitespace changed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for p in Path('app').rglob('*.php'):
              s = p.as_posix()
              if '/views/' in s or s.startswith('app/Views/'):
                  candidates.append(p)
          for root in [Path('app/Portal/Themes'), Path('mt_hotspot'), Path('public')]:
              if root.exists():
                  candidates.extend(root.rglob('*.html'))

          changed = 0
          for path in sorted(set(candidates)):
              before = Path('/tmp/pixiepoint-before') / path
              if not before.exists():
                  continue
              old = before.read_text(encoding='utf-8')
              new = path.read_text(encoding='utf-8')
              if old == new:
                  continue
              if re.sub(r'\s+', '', old) != re.sub(r'\s+', '', new):
                  raise SystemExit(f'Non-whitespace character changed: {path}')
              changed += 1

          print(f'Whitespace-only hierarchy formatting verified for {changed} files.')
          PY

      - name: Validate PHP syntax
        run: |
          find app -type f -name '*.php' \( -path '*/views/*' -o -path 'app/Views/*' \) -print0 | xargs -0 -n1 php -l

      - name: Commit hierarchy formatting
        run: |
          rm -rf node_modules
          rm -f .format-html-hierarchy .github/workflows/format-html-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format HTML markup by hierarchy"
          git push origin HEAD:main
