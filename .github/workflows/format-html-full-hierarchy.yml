name: Fully indent HTML hierarchy

on:
  push:
    branches:
      - main
    paths:
      - .format-html-full-hierarchy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Save originals
        run: |
          mkdir -p /tmp/pixiepoint-before
          rsync -a --exclude=.git --exclude=node_modules ./ /tmp/pixiepoint-before/

      - name: Install formatter
        run: npm install --no-save --no-package-lock js-beautify@1.15.4

      - name: Fully indent HTML element hierarchy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const htmlBeautify = require('js-beautify').html;

          function walk(dir, out = []) {
              if (!fs.existsSync(dir)) return out;
              for (const name of fs.readdirSync(dir)) {
                  const p = path.join(dir, name);
                  const st = fs.statSync(p);
                  if (st.isDirectory()) walk(p, out);
                  else out.push(p);
              }
              return out;
          }

          const files = [];

          for (const p of walk('app')) {
              const s = p.replace(/\\/g, '/');
              if (s.endsWith('.php') && (s.includes('/views/') || s.startsWith('app/Views/'))) files.push(p);
              if (s.endsWith('.html') && s.startsWith('app/Portal/Themes/')) files.push(p);
          }

          for (const root of ['mt_hotspot', 'public']) {
              for (const p of walk(root)) if (p.endsWith('.html')) files.push(p);
          }

          for (const file of files) {
              const isPhp = file.endsWith('.php');
              let src = fs.readFileSync(file, 'utf8');

              src = htmlBeautify(src, {
                  indent_size: isPhp ? 4 : 2,
                  wrap_line_length: 0,
                  max_preserve_newlines: 2,
                  templating: ['php'],
                  inline: [],
                  unformatted: [],
                  content_unformatted: ['pre', 'textarea', 'script', 'style'],
                  extra_liners: []
              });

              if (isPhp) {
                  src = src.replace(
                      /<\?php[ \t]*\r?\n[ \t]*(?=(?:if|elseif|else|foreach|for|while|switch|endif|endforeach|endfor|endwhile|endswitch)\b)/g,
                      '<?php '
                  );
              }

              fs.writeFileSync(file, src);
          }
          NODE

      - name: Verify only whitespace changed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for p in Path('app').rglob('*'):
              s = p.as_posix()
              if p.is_file() and p.suffix == '.php' and ('/views/' in s or s.startswith('app/Views/')):
                  candidates.append(p)
              elif p.is_file() and p.suffix == '.html' and s.startswith('app/Portal/Themes/'):
                  candidates.append(p)

          for root in [Path('mt_hotspot'), Path('public')]:
              if root.exists():
                  candidates.extend(p for p in root.rglob('*.html') if p.is_file())

          changed = 0
          for path in sorted(set(candidates)):
              before = Path('/tmp/pixiepoint-before') / path
              old = before.read_text(encoding='utf-8')
              new = path.read_text(encoding='utf-8')

              if old == new:
                  continue

              if re.sub(r'\s+', '', old) != re.sub(r'\s+', '', new):
                  raise SystemExit(f'Non-whitespace character changed: {path}')

              changed += 1

          print(f'Whitespace-only verification passed for {changed} files.')
          PY

      - name: Validate PHP syntax
        run: |
          find app -type f -name '*.php' \( -path '*/views/*' -o -path 'app/Views/*' \) -print0 | xargs -0 -n1 php -l

      - name: Commit
        run: |
          rm -rf node_modules
          rm -f .format-html-full-hierarchy .github/workflows/format-html-full-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fully indent HTML element hierarchy"
          git push origin HEAD:main
