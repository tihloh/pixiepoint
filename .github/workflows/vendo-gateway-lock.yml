name: vendo-gateway-integration-check
on:
  push:
    branches: [feature/vendo-gateway-integration-final]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: find app src bin -name '*.php' -print0 | xargs -0 -n1 php -l
