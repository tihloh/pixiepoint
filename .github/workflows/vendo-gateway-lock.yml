name: vendo-gateway-lock
on:
  push:
    branches: [feature/vendo-gateway-integration-final]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vendo-gateway-integration-final
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer update tihloh/vendo-gateway --with-dependencies --no-interaction --prefer-dist
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git diff --cached --quiet || git commit -m 'Lock Vendo Gateway v1.0.0'
          git push
