name: Format source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest formatting run should survive when several source files are
# committed close together.
concurrency:
  group: pixiepoint-source-format-main
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP CS Fixer
        run: composer global require friendsofphp/php-cs-fixer:^3 --no-interaction --no-progress

      # PixiePoint is a PHP project. Keep automated formatting PHP-only so local
      # development and CI do not require Node.js, npm, Prettier, or node_modules.
      - name: Format PHP source
        run: |
          "$(composer global config bin-dir --absolute)/php-cs-fixer" fix \
            --config=.php-cs-fixer.dist.php \
            --using-cache=no \
            --allow-risky=no

      # Mixed PHP/HTML views are intentionally kept human-readable in source.
      # PHP CS Fixer normalizes their PHP portions without rewriting the markup.
      - name: Validate PHP syntax
        run: |
          find app src bin config public -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php -l router.php
          php -l config.example.php

      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format PHP source"
          git push
