<link rel="stylesheet" href="{{ theme.asset_url }}/theme.css">
<main id="pp-page" class="neon-shell">
    <section id="pp-status-card" class="portal-card p-4">
        <div id="pp-session">
            <div id="pp-brand" class="brand mb-3">{{ portal.name }}</div>
            <h1 id="pp-session-title" class="h3 mb-2">You're connected</h1>
            <p id="pp-session-description" class="muted mb-4">Live Wi-Fi session.</p>
            <div id="pp-session-details" class="context mb-3">
                <div><small>Device</small><span id="pp-session-device">—</span></div>
                <div><small>Time left</small><span id="pp-time-left">Unlimited</span></div>
                <div><small>Data in</small><span id="pp-data-in">0 B</span></div>
                <div><small>Data out</small><span id="pp-data-out">0 B</span></div>
            </div>
            <button id="pp-extend" class="button secondary full mb-3" type="button" hidden>Extend time</button>
            <div id="pp-extend-box" class="compat-transaction mb-3" hidden>
                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                    <div>
                        <small class="d-block">Extend current voucher</small>
                        <strong id="pp-extend-voucher" class="d-block">—</strong>
                    </div>
                    <small id="pp-extend-countdown" class="compat-countdown text-nowrap">Waiting…</small>
                </div>
                <div class="progress mb-3"><div id="pp-extend-progress-bar" class="progress-bar" style="width:100%"></div></div>
                <div class="context mb-3">
                    <div><small>Coin total</small><span id="pp-extend-amount">₱0</span></div>
                    <div><small>Added time</small><span id="pp-extend-time">—</span></div>
                </div>
                <p id="pp-extend-status" class="muted mb-3">Activating coin slot…</p>
                <div class="actions">
                    <button id="pp-extend-finish" class="button" type="button" disabled>Done</button>
                    <button id="pp-extend-cancel" class="button secondary" type="button">Cancel</button>
                </div>
            </div>
            <div id="pp-session-actions" class="actions">
                <form id="pp-disconnect-form" method="post"><button id="pp-disconnect" class="button secondary" type="submit">Disconnect</button></form>
                <button id="pp-end-session" class="button secondary" type="button">End session</button>
            </div>
        </div>
        <div id="pp-disconnected" hidden>
            <div id="pp-disconnected-title" class="h4 mb-2">Session ended</div>
            <p id="pp-disconnected-message" class="muted mb-3">Your Wi-Fi session has ended.</p>
            <a id="pp-login" class="button" href="#">Connect again</a>
        </div>
    </section>
</main>
