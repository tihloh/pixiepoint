<link rel="stylesheet" href="{{ theme.asset_url }}/theme.css">
<main id="pp-page" class="neon-shell">
    <section id="pp-login-card" class="portal-card">
        <div id="compat-app">
            <div id="compat-brand" class="brand">{{ portal.name }}</div>
            <h1 id="compat-title">Connect to Wi-Fi</h1>
            <p id="compat-description" class="muted">Insert coins or enter an existing voucher.</p>
            <div id="compat-alert" class="alert" hidden></div>
            <div id="compat-topup-slot">
                <label for="compat-vendo">Vendo</label>
                <select id="compat-vendo">{{{ portal.vendo_options }}}</select>
                <small id="compat-health" class="compat-status">Checking the local Vendo…</small>
            </div>
            <form id="compat-voucher-form" class="compat-voucher">
                <label for="compat-voucher">Voucher</label>
                <div class="input-group">
                    <input id="compat-voucher" autocomplete="one-time-code" autocapitalize="characters" required>
                    <button id="compat-connect" class="button" type="submit">Connect</button>
                </div>
            </form>
            <button id="compat-topup" class="button full" type="button" disabled>Insert coin</button>
            <button id="compat-rates" class="button secondary full" type="button" disabled>View rates</button>
            <div id="compat-tools" class="compat-tools">
                <button id="compat-charging" class="button secondary" type="button" hidden>Phone charging</button>
                <button id="compat-eload" class="button secondary" type="button" hidden>Buy e-load</button>
            </div>
            <div id="compat-transaction" class="compat-transaction" hidden>
                <small>Your voucher</small><strong id="compat-code">—</strong>
                <div class="context">
                    <div><small>Coin total</small><span id="compat-amount">₱0</span></div>
                    <div><small>Time</small><span id="compat-time">—</span></div>
                </div>
                <div class="progress"><div id="compat-progress-bar" class="progress-bar" style="width:100%"></div></div>
                <div id="compat-countdown">Waiting…</div>
                <p id="compat-progress" class="muted">Waiting for coins…</p>
                <div class="actions">
                    <button id="compat-finish" class="button" type="button" disabled>Done &amp; connect</button>
                    <button id="compat-cancel" class="button secondary" type="button">Cancel</button>
                </div>
            </div>
            <div id="compat-rate-list" hidden></div>
            <div id="compat-charger-list" hidden></div>
            <div id="compat-eload-panel" hidden><div id="compat-eload-products">Loading products…</div></div>
        </div>
    </section>
</main>
