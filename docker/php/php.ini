expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 30
post_max_size = 4M
upload_max_filesize = 2M
session.cookie_httponly = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

